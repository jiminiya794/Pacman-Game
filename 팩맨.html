<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030307" />
  <meta name="description" content="네온 미로에서 코인을 모으는 3레벨 아케이드 게임" />
  <title>Neon Pac-Maze</title>
  <style>
    :root {
      --ink: #030307;
      --panel: rgba(10, 13, 24, 0.88);
      --line: rgba(150, 174, 255, 0.2);
      --paper: #f7f8ff;
      --muted: #a4afc9;
      --green: #72ff7b;
      --pink: #ff55c8;
      --blue: #4da9ff;
      --gold: #ffe75d;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html {
      height: 100%;
      overflow: hidden;
      background: var(--ink);
    }

    body {
      min-width: 320px;
      height: 100vh;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% -20%, rgba(77, 169, 255, 0.14), transparent 38rem),
        radial-gradient(circle at 15% 50%, rgba(255, 85, 200, 0.08), transparent 34rem),
        var(--ink);
      color: var(--paper);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .game-shell {
      width: min(100%, 760px);
      height: 100vh;
      margin: 0 auto;
      padding: clamp(0.5rem, 1.5vh, 1rem) clamp(0.75rem, 3vw, 1.5rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 clamp(0.45rem, 1vh, 0.75rem);
    }

    .eyebrow {
      margin: 0 0 0.3rem;
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 6vw, 2.65rem);
      line-height: 0.94;
      letter-spacing: -0.08em;
      text-shadow: 0 0 18px rgba(77, 169, 255, 0.3);
    }

    .run-badge {
      flex: none;
      padding: 0.5rem 0.65rem;
      border: 1px solid rgba(255, 85, 200, 0.6);
      border-radius: 999px;
      color: var(--pink);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      box-shadow: 0 0 18px rgba(255, 85, 200, 0.13);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: clamp(0.45rem, 1vh, 0.7rem);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(5, 7, 14, 0.78);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.04), 0 16px 45px rgba(0, 0, 0, 0.24);
    }

    .stat {
      min-width: 0;
      padding: 0.7rem 0.55rem 0.72rem;
      border-right: 1px solid var(--line);
      text-align: center;
    }

    .stat:last-child { border-right: 0; }

    .stat-label {
      display: block;
      margin-bottom: 0.28rem;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .stat-value {
      display: block;
      overflow: hidden;
      color: var(--paper);
      font-size: clamp(0.85rem, 3.6vw, 1.15rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      text-overflow: clip;
      white-space: nowrap;
    }

    #levelValue { color: var(--blue); }
    #coinValue { color: var(--gold); }
    #lifeValue { color: var(--pink); }

    .game-stage {
      position: relative;
      width: auto;
      height: min(597px, calc(100vh - 12rem));
      max-width: 100%;
      margin-inline: auto;
      align-self: center;
      flex: none;
      aspect-ratio: 21 / 19;
      overflow: hidden;
      border: 1px solid rgba(112, 255, 123, 0.44);
      border-radius: calc(var(--radius) + 2px);
      background: #020207;
      box-shadow:
        0 0 0 1px rgba(77, 169, 255, 0.08),
        0 0 35px rgba(77, 169, 255, 0.14),
        0 30px 70px rgba(0, 0, 0, 0.42);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.13;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(255, 255, 255, 0.13) 4px
      );
      mix-blend-mode: overlay;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 0.75rem;
      padding: 1.5rem;
      background: rgba(2, 3, 10, 0.8);
      text-align: center;
      backdrop-filter: blur(5px);
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .overlay.is-hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .overlay-kicker {
      margin: 0;
      color: var(--green);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .overlay h2 {
      max-width: 18ch;
      margin: 0;
      color: #fff;
      font-size: clamp(1.55rem, 7vw, 2.5rem);
      line-height: 1;
      letter-spacing: -0.08em;
      text-shadow: 0 0 18px rgba(255, 85, 200, 0.36);
    }

    .overlay-copy {
      max-width: 32ch;
      margin: 0;
      color: #c8cfe4;
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .primary-action {
      min-width: min(100%, 15rem);
      margin-top: 0.2rem;
      padding: 0.85rem 1.15rem;
      border: 1px solid var(--green);
      border-radius: 999px;
      background: rgba(114, 255, 123, 0.09);
      color: var(--green);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      box-shadow: 0 0 22px rgba(114, 255, 123, 0.22), inset 0 0 16px rgba(114, 255, 123, 0.05);
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .primary-action:hover,
    .primary-action:focus-visible {
      outline: none;
      background: rgba(114, 255, 123, 0.18);
      box-shadow: 0 0 28px rgba(114, 255, 123, 0.38), inset 0 0 16px rgba(114, 255, 123, 0.1);
      transform: translateY(-1px);
    }

    .support-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: clamp(0.45rem, 1vh, 0.7rem) 0 0;
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .hint {
      margin: 0;
      color: #c6cee4;
      font-size: 0.83rem;
      line-height: 1.45;
    }

    .level-pips {
      display: flex;
      flex: none;
      gap: 0.32rem;
    }

    .pip {
      width: 0.6rem;
      height: 0.6rem;
      border: 1px solid rgba(164, 175, 201, 0.8);
      border-radius: 50%;
      background: transparent;
    }

    .pip.active {
      border-color: var(--green);
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 440px) {
      .game-shell { padding-inline: 0.65rem; }
      .masthead { align-items: center; }
      .run-badge { font-size: 0.62rem; }
      .stat { padding-inline: 0.25rem; }
      .stat-label { font-size: 0.58rem; }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-labelledby="game-title">
    <header class="masthead">
      <div>
        <p class="eyebrow">PERSONAL ARCADE</p>
        <h1 id="game-title">NEON PAC-MAZE</h1>
      </div>
      <div class="run-badge" aria-label="3개 레벨">3 LEVEL RUN</div>
    </header>

    <section class="stats" aria-label="현재 게임 상태">
      <div class="stat"><span class="stat-label">SCORE</span><strong class="stat-value" id="scoreValue">0000</strong></div>
      <div class="stat"><span class="stat-label">LEVEL</span><strong class="stat-value" id="levelValue">01 / 03</strong></div>
      <div class="stat"><span class="stat-label">COINS</span><strong class="stat-value" id="coinValue">0</strong></div>
      <div class="stat"><span class="stat-label">LIVES</span><strong class="stat-value" id="lifeValue">● ● ●</strong></div>
    </section>

    <section class="game-stage" aria-label="네온 미로 게임 화면">
      <canvas id="gameCanvas" width="588" height="532" aria-label="방향키 또는 W, A, S, D 키로 팩맨을 움직여 코인을 모두 모으세요."></canvas>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlayTitle" aria-describedby="overlayCopy">
        <p class="overlay-kicker" id="overlayKicker">READY PLAYER</p>
        <h2 id="overlayTitle">NEON PAC-MAZE</h2>
        <p class="overlay-copy" id="overlayCopy">코인을 모두 모아 세 레벨을 돌파하세요.</p>
        <button class="primary-action" id="actionButton" type="button">게임 시작</button>
      </div>
    </section>

    <section class="support-panel" aria-label="조작 안내">
      <p class="hint">방향키 또는 <b>W A S D</b>로 움직이세요. 코인을 모두 모으면 다음 레벨로 이동합니다.</p>
      <div class="level-pips" aria-label="레벨 진행도">
        <span class="pip active" id="pip0"></span><span class="pip" id="pip1"></span><span class="pip" id="pip2"></span>
      </div>
    </section>

    <p class="sr-only" id="screenReaderStatus" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const overlayKicker = document.getElementById("overlayKicker");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayCopy = document.getElementById("overlayCopy");
      const actionButton = document.getElementById("actionButton");
      const scoreValue = document.getElementById("scoreValue");
      const levelValue = document.getElementById("levelValue");
      const coinValue = document.getElementById("coinValue");
      const lifeValue = document.getElementById("lifeValue");
      const screenReaderStatus = document.getElementById("screenReaderStatus");
      const pips = [document.getElementById("pip0"), document.getElementById("pip1"), document.getElementById("pip2")];

      const TILE = 28;
      const NEON = ["#72ff7b", "#ff55c8", "#4da9ff"];
      const GHOST_COLORS = ["#ff55c8", "#4da9ff", "#72ff7b", "#ff9b51"];
      const blueprint = [
        "#####################",
        "#.........#.........#",
        "#.###.###.#.###.###.#",
        "#.#.....#.#.#.....#.#",
        "#.#.###.#.#.#.###.#.#",
        "#...#.....#.....#...#",
        "###.#.###...###.#.###",
        "#...#...#.....#...#.#",
        "#.#####.#.###.#.###.#",
        "#.......#.....#.....#",
        "#.#####.#####.#####.#",
        "#.#...#...#...#...#.#",
        "#.#.#.###.#.###.#.#.#",
        "#...#.....#.....#...#",
        "###.#####.#####.###.#",
        "#.....#.....#.....#.#",
        "#.###.#.###.#.###.#.#",
        "#.........#.........#",
        "#####################"
      ];
      const COLS = blueprint[0].length;
      const ROWS = blueprint.length;
      const DIRECTIONS = {
        up: { x: 0, y: -1, name: "up" },
        down: { x: 0, y: 1, name: "down" },
        left: { x: -1, y: 0, name: "left" },
        right: { x: 1, y: 0, name: "right" },
        none: { x: 0, y: 0, name: "none" }
      };
      const ALL_DIRECTIONS = [DIRECTIONS.up, DIRECTIONS.down, DIRECTIONS.left, DIRECTIONS.right];
      const LEVELS = [
        { monsters: 2, playerSpeed: 5.8, ghostSpeed: 4.15, chase: 0.61, label: "레벨 1" },
        { monsters: 3, playerSpeed: 5.95, ghostSpeed: 5.0, chase: 0.73, label: "레벨 2" },
        { monsters: 4, playerSpeed: 6.1, ghostSpeed: 5.9, chase: 0.84, label: "레벨 3" }
      ];
      const PLAYER_SPAWN = { x: 9, y: 17 };
      const GHOST_SPAWNS = [
        { x: 10, y: 9, dir: DIRECTIONS.right },
        { x: 9, y: 9, dir: DIRECTIONS.left },
        { x: 11, y: 9, dir: DIRECTIONS.right },
        { x: 12, y: 9, dir: DIRECTIONS.left }
      ];
      const stars = Array.from({ length: 72 }, (_, index) => ({
        x: (index * 89 + 31) % (COLS * TILE),
        y: (index * 47 + 17) % (ROWS * TILE),
        r: index % 5 === 0 ? 1.1 : 0.55,
        phase: index * 0.71
      }));

      const state = {
        phase: "intro",
        levelIndex: 0,
        score: 0,
        lives: 3,
        coins: new Set(),
        player: null,
        ghosts: [],
        invulnerableUntil: 0,
        clock: 0,
        lastFrame: 0
      };

      function cellKey(x, y) {
        return `${x},${y}`;
      }

      function cloneDirection(direction) {
        return { x: direction.x, y: direction.y, name: direction.name };
      }

      function isWalkable(x, y) {
        return blueprint[y] && blueprint[y][x] === ".";
      }

      function isCentered(entity) {
        return Math.abs(entity.x - (Math.floor(entity.x) + 0.5)) < 0.001 &&
          Math.abs(entity.y - (Math.floor(entity.y) + 0.5)) < 0.001;
      }

      function snapToCenter(entity) {
        entity.x = Math.floor(entity.x) + 0.5;
        entity.y = Math.floor(entity.y) + 0.5;
      }

      function canMoveFromCenter(entity, direction) {
        if (!direction || (!direction.x && !direction.y)) return false;
        const x = Math.floor(entity.x);
        const y = Math.floor(entity.y);
        return isWalkable(x + direction.x, y + direction.y);
      }

      function resetEntities() {
        const level = LEVELS[state.levelIndex];
        state.player = {
          x: PLAYER_SPAWN.x + 0.5,
          y: PLAYER_SPAWN.y + 0.5,
          dir: cloneDirection(DIRECTIONS.none),
          nextDir: cloneDirection(DIRECTIONS.left)
        };
        state.ghosts = GHOST_SPAWNS.slice(0, level.monsters).map((spawn, index) => ({
          x: spawn.x + 0.5,
          y: spawn.y + 0.5,
          dir: cloneDirection(spawn.dir),
          color: GHOST_COLORS[index],
          index
        }));
      }

      function prepareCoins() {
        state.coins = new Set();
        for (let y = 0; y < ROWS; y += 1) {
          for (let x = 0; x < COLS; x += 1) {
            if (isWalkable(x, y)) state.coins.add(cellKey(x, y));
          }
        }
        state.coins.delete(cellKey(PLAYER_SPAWN.x, PLAYER_SPAWN.y));
        GHOST_SPAWNS.forEach((spawn) => state.coins.delete(cellKey(spawn.x, spawn.y)));
      }

      function loadLevel(index) {
        state.levelIndex = index;
        prepareCoins();
        resetEntities();
        updateHud();
      }

      function updateHud() {
        scoreValue.textContent = String(state.score).padStart(4, "0");
        levelValue.textContent = `0${state.levelIndex + 1} / 03`;
        coinValue.textContent = String(state.coins.size);
        lifeValue.textContent = Array.from({ length: state.lives }, () => "●").join(" ") || "—";
        pips.forEach((pip, index) => pip.classList.toggle("active", index <= state.levelIndex));
      }

      function announce(message) {
        screenReaderStatus.textContent = "";
        window.setTimeout(() => { screenReaderStatus.textContent = message; }, 20);
      }

      function showOverlay(kicker, title, copy, action) {
        overlayKicker.textContent = kicker;
        overlayTitle.textContent = title;
        overlayCopy.textContent = copy;
        actionButton.textContent = action;
        overlay.classList.remove("is-hidden");
        window.setTimeout(() => actionButton.focus({ preventScroll: true }), 60);
      }

      function hideOverlay() {
        overlay.classList.add("is-hidden");
      }

      function showIntro() {
        state.phase = "intro";
        showOverlay("READY PLAYER", "NEON PAC-MAZE", "코인을 모두 모아 세 레벨을 돌파하세요.", "게임 시작");
        announce("네온 팩맨 게임 준비 완료. 게임 시작 버튼을 누르세요.");
      }

      function startNewRun() {
        state.score = 0;
        state.lives = 3;
        state.invulnerableUntil = 0;
        loadLevel(0);
        showIntro();
      }

      function startPlaying() {
        state.phase = "playing";
        state.invulnerableUntil = performance.now() + 1200;
        hideOverlay();
        announce(`레벨 ${state.levelIndex + 1} 시작. ${LEVELS[state.levelIndex].monsters}마리의 몬스터를 피하세요.`);
      }

      function beginNextLevel() {
        loadLevel(state.levelIndex + 1);
        state.phase = "playing";
        state.invulnerableUntil = performance.now() + 1300;
        hideOverlay();
        announce(`레벨 ${state.levelIndex + 1} 시작.`);
      }

      function onPrimaryAction() {
        if (state.phase === "intro") {
          startPlaying();
        } else if (state.phase === "lifeLost") {
          state.phase = "playing";
          state.invulnerableUntil = performance.now() + 1250;
          hideOverlay();
          announce("계속 진행합니다. 잠시 동안 안전합니다.");
        } else if (state.phase === "levelClear") {
          beginNextLevel();
        } else if (state.phase === "gameOver" || state.phase === "won") {
          startNewRun();
          startPlaying();
        }
      }

      function choosePlayerDirection(player) {
        if (canMoveFromCenter(player, player.nextDir)) {
          player.dir = cloneDirection(player.nextDir);
        } else if (!canMoveFromCenter(player, player.dir)) {
          player.dir = cloneDirection(DIRECTIONS.none);
        }
      }

      function chooseGhostDirection(ghost) {
        const level = LEVELS[state.levelIndex];
        const possible = ALL_DIRECTIONS.filter((direction) => canMoveFromCenter(ghost, direction));
        if (!possible.length) {
          ghost.dir = cloneDirection(DIRECTIONS.none);
          return;
        }

        const reverse = { x: -ghost.dir.x, y: -ghost.dir.y };
        const withoutReverse = possible.filter((direction) => direction.x !== reverse.x || direction.y !== reverse.y);
        const choices = withoutReverse.length ? withoutReverse : possible;
        let selected;

        if (Math.random() < level.chase) {
          const target = state.player;
          const ranked = choices.slice().sort((a, b) => {
            const ax = Math.floor(ghost.x) + a.x + 0.5;
            const ay = Math.floor(ghost.y) + a.y + 0.5;
            const bx = Math.floor(ghost.x) + b.x + 0.5;
            const by = Math.floor(ghost.y) + b.y + 0.5;
            return Math.hypot(ax - target.x, ay - target.y) - Math.hypot(bx - target.x, by - target.y);
          });
          const preferred = ranked.filter((direction, index) => {
            if (index === 0) return true;
            const first = ranked[0];
            const fx = Math.floor(ghost.x) + first.x + 0.5;
            const fy = Math.floor(ghost.y) + first.y + 0.5;
            const dx = Math.floor(ghost.x) + direction.x + 0.5;
            const dy = Math.floor(ghost.y) + direction.y + 0.5;
            return Math.abs(Math.hypot(dx - target.x, dy - target.y) - Math.hypot(fx - target.x, fy - target.y)) < 0.12;
          });
          selected = preferred[Math.floor(Math.random() * preferred.length)];
        } else {
          selected = choices[Math.floor(Math.random() * choices.length)];
        }
        ghost.dir = cloneDirection(selected);
      }

      function advance(entity, speed, delta, onCenter) {
        let remaining = speed * delta;
        let guard = 0;
        while (remaining > 0.0001 && guard < 5) {
          guard += 1;
          if (isCentered(entity)) {
            snapToCenter(entity);
            onCenter(entity);
          }
          if (!entity.dir.x && !entity.dir.y) break;

          // A movement segment can only begin when the adjacent tile is open.
          // This hard check keeps every character outside a wall even after a
          // long frame, a quick input change, or a direction queued at a corner.
          if (isCentered(entity) && !canMoveFromCenter(entity, entity.dir)) {
            entity.dir = cloneDirection(DIRECTIONS.none);
            break;
          }

          const axis = entity.dir.x ? "x" : "y";
          const direction = entity.dir[axis];
          const current = entity[axis];
          // Move only as far as the *next* tile center. Reaching every center
          // before continuing is what lets us re-check the wall directly ahead.
          // The former floor-only calculation could skip a center while moving
          // left or up, allowing a character to slip into a wall tile.
          const nextCenter = direction > 0
            ? Math.floor(current - 0.5 + 0.000001) + 1.5
            : Math.ceil(current - 0.5 - 0.000001) - 0.5;
          const distance = Math.abs(nextCenter - current);

          if (remaining + 0.0001 >= distance) {
            entity[axis] = nextCenter;
            remaining -= distance;
          } else {
            entity[axis] += direction * remaining;
            remaining = 0;
          }
        }
      }

      function collectCoin() {
        const x = Math.floor(state.player.x);
        const y = Math.floor(state.player.y);
        const key = cellKey(x, y);
        const centerX = x + 0.5;
        const centerY = y + 0.5;
        if (state.coins.has(key) && Math.hypot(state.player.x - centerX, state.player.y - centerY) < 0.33) {
          state.coins.delete(key);
          state.score += 10;
          updateHud();
        }
      }

      function handleCollision(now) {
        if (now < state.invulnerableUntil) return;
        const hit = state.ghosts.some((ghost) => Math.hypot(ghost.x - state.player.x, ghost.y - state.player.y) < 0.62);
        if (!hit) return;

        state.lives -= 1;
        updateHud();
        if (state.lives <= 0) {
          state.phase = "gameOver";
          showOverlay("RUN OVER", "GAME OVER", `점수 ${state.score}점. 처음부터 다시 달릴까요?`, "다시 시작");
          announce(`게임 오버. 최종 점수 ${state.score}점.`);
        } else {
          resetEntities();
          state.phase = "lifeLost";
          showOverlay("SIGNAL LOST", "생명을 잃었어요", `남은 생명은 ${state.lives}개입니다. 다시 미로로 돌아가세요.`, "계속하기");
          announce(`생명을 잃었습니다. 남은 생명 ${state.lives}개.`);
        }
      }

      function completeLevel() {
        if (state.levelIndex === LEVELS.length - 1) {
          state.phase = "won";
          showOverlay("MISSION COMPLETE", "NEON MAZE CLEAR!", `세 레벨을 모두 돌파했습니다. 최종 점수 ${state.score}점!`, "처음부터");
          announce(`축하합니다. 세 레벨을 모두 완료했습니다. 최종 점수 ${state.score}점.`);
        } else {
          state.phase = "levelClear";
          showOverlay("LEVEL CLEAR", `LEVEL ${state.levelIndex + 1} COMPLETE`, "모든 코인을 모았습니다. 다음 레벨에 도전하세요.", "다음 레벨");
          announce(`레벨 ${state.levelIndex + 1} 완료. 다음 레벨로 이동할 수 있습니다.`);
        }
      }

      function update(delta, now) {
        const level = LEVELS[state.levelIndex];
        advance(state.player, level.playerSpeed, delta, choosePlayerDirection);
        collectCoin();
        if (!state.coins.size) {
          completeLevel();
          return;
        }
        state.ghosts.forEach((ghost) => {
          advance(ghost, level.ghostSpeed + ghost.index * 0.06, delta, chooseGhostDirection);
        });
        handleCollision(now);
      }

      function roundedRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + width - r, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + r);
        ctx.lineTo(x + width, y + height - r);
        ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        ctx.lineTo(x + r, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawBackdrop() {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, "#070719");
        gradient.addColorStop(0.52, "#02030a");
        gradient.addColorStop(1, "#080511");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        stars.forEach((star) => {
          const pulse = 0.34 + Math.sin(state.clock * 1.8 + star.phase) * 0.2;
          ctx.fillStyle = `rgba(186, 212, 255, ${pulse})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawMaze() {
        for (let y = 0; y < ROWS; y += 1) {
          for (let x = 0; x < COLS; x += 1) {
            if (!isWalkable(x, y)) {
              const color = NEON[(x + y * 2 + state.levelIndex) % NEON.length];
              const inset = 2.4;
              ctx.save();
              ctx.shadowColor = color;
              ctx.shadowBlur = 8;
              roundedRect(x * TILE + inset, y * TILE + inset, TILE - inset * 2, TILE - inset * 2, 5);
              ctx.fillStyle = "#081326";
              ctx.fill();
              ctx.lineWidth = 2;
              ctx.strokeStyle = color;
              ctx.stroke();
              ctx.restore();
            }
          }
        }
      }

      function drawCoins() {
        state.coins.forEach((key) => {
          const [x, y] = key.split(",").map(Number);
          const pulse = 0.55 + (Math.sin(state.clock * 7 + x * 0.8 + y) + 1) * 0.45;
          const cx = (x + 0.5) * TILE;
          const cy = (y + 0.5) * TILE;
          ctx.save();
          ctx.globalAlpha = Math.min(1, pulse);
          ctx.fillStyle = "#fff0a5";
          ctx.shadowColor = "#ffe75d";
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(cx, cy, 3.2 + pulse * 0.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      function drawPlayer() {
        const player = state.player;
        const cx = player.x * TILE;
        const cy = player.y * TILE;
        const angle = player.dir.name === "none" ? 0 : Math.atan2(player.dir.y, player.dir.x);
        const mouth = 0.16 + Math.abs(Math.sin(state.clock * 13)) * 0.29;
        const invisibleBlink = performance.now() < state.invulnerableUntil && Math.floor(state.clock * 10) % 2 === 0;
        ctx.save();
        ctx.globalAlpha = invisibleBlink ? 0.43 : 1;
        ctx.fillStyle = "#ffe75d";
        ctx.shadowColor = "#ffe75d";
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, TILE * 0.38, angle + mouth, angle + Math.PI * 2 - mouth);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawGhost(ghost) {
        const cx = ghost.x * TILE;
        const cy = ghost.y * TILE;
        const r = TILE * 0.36;
        const pupilX = ghost.dir.x * 2.1;
        const pupilY = ghost.dir.y * 2.1;
        ctx.save();
        ctx.fillStyle = ghost.color;
        ctx.shadowColor = ghost.color;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.moveTo(cx - r, cy + r * 0.92);
        ctx.lineTo(cx - r, cy - r * 0.08);
        ctx.arc(cx, cy - r * 0.08, r, Math.PI, 0);
        ctx.lineTo(cx + r, cy + r * 0.92);
        ctx.lineTo(cx + r * 0.42, cy + r * 0.62);
        ctx.lineTo(cx, cy + r * 0.92);
        ctx.lineTo(cx - r * 0.42, cy + r * 0.62);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        [-0.34, 0.34].forEach((offset) => {
          ctx.fillStyle = "#f7fbff";
          ctx.beginPath();
          ctx.ellipse(cx + r * offset, cy - r * 0.06, r * 0.23, r * 0.29, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#14182f";
          ctx.beginPath();
          ctx.arc(cx + r * offset + pupilX, cy - r * 0.06 + pupilY, r * 0.1, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      function render() {
        drawBackdrop();
        drawMaze();
        drawCoins();
        state.ghosts.forEach(drawGhost);
        drawPlayer();
      }

      function gameLoop(now) {
        const delta = Math.min((now - state.lastFrame) / 1000 || 0, 0.033);
        state.lastFrame = now;
        state.clock += delta;
        if (state.phase === "playing") update(delta, now);
        render();
        requestAnimationFrame(gameLoop);
      }

      function setNextDirection(name) {
        if (!DIRECTIONS[name] || !state.player) return;
        state.player.nextDir = cloneDirection(DIRECTIONS[name]);
      }

      const keyToDirection = {
        ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
        w: "up", W: "up", s: "down", S: "down", a: "left", A: "left", d: "right", D: "right"
      };

      window.addEventListener("keydown", (event) => {
        const direction = keyToDirection[event.key];
        if (direction) {
          event.preventDefault();
          setNextDirection(direction);
          return;
        }
        if ((event.key === "Enter" || event.key === " ") && state.phase !== "playing" && document.activeElement !== actionButton) {
          event.preventDefault();
          onPrimaryAction();
        }
      });

      actionButton.addEventListener("click", onPrimaryAction);
      document.addEventListener("visibilitychange", () => { state.lastFrame = performance.now(); });

      startNewRun();
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
